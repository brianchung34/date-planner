
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Date ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }
.greeting {
  color: #a32357;
  font-size: 28px;
  margin-bottom: 5px;

}
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        120deg,
        #f9d6e8,
        #f4a6c8,
        #e889b4,
        #f8c4df
      );
      background-size: 300% 300%;
      animation: gradientMove 10s ease infinite;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #a32357;
      font-size: clamp(25px, 5vw, 42px);
      margin-bottom: 25px;
    }

    .panda {
      width: 230px;
      max-width: 75vw;
      height: auto;
      border-radius: 20px;
      margin: 15px 0;
      animation: float 2s ease-in-out infinite;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
      min-height: 55px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yesBtn {
      background: #4caf50;
      box-shadow: 0 4px 12px #a0cfa2;
    }

    #yesBtn:hover {
      transform: scale(1.15);
    }

#noBtn {
  background: #e74c3c;
  position: relative;
  z-index: 10;
  touch-action: none;

  transition: left 0.6s ease, top 0.6s ease;
}

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes gradientMove {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }
    
/* PAGE 2 - MUSEUM SELECTION */

.museum-page {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 30px 15px;
  text-align: center;
}

.museum-page h1 {
  margin-bottom: 10px;
}

.museum-subtitle {
  color: #a32357;
  font-size: 18px;
  margin-bottom: 30px;
}

.museum-options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  width: 100%;
}

.museum-card {
  width: 100%;
  height: 240px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #fff5f9;
  border: 3px solid transparent;
  border-radius: 18px;
  padding: 10px;
  cursor: pointer;
  color: #a32357;
  box-shadow: 0 5px 18px rgba(130,40,80,0.12);
  transition: transform 0.25s, border-color 0.25s;
}

.museum-card:hover {
  transform: translateY(-5px);
}

.museum-card.selected {
  border-color: #e34d90;
  background: #ffe0ee;
}

.museum-card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  border-radius: 12px;
}

.museum-card h3 {
  margin: auto 0;
  font-size: 17px;
  text-align: center;
}

.museum-navigation {
  margin-top: 25px;
}

.museum-navigation button {
  background: #e879a2;
  border-radius: 25px;
}

.museum-message {
  color: #a32357;
  margin-top: 20px;
  font-weight: bold;
  min-height: 24px;
}

@media (max-width: 650px) {
  .museum-options {
    grid-template-columns: 1fr;
    max-width: 350px;
    margin: auto;
  }

  .museum-card {
    height: 230px;
  }

  body:has(.museum-page) {
    overflow-y: auto;
  }
}

/* PAGE 3 - RESTAURANT SELECTION */

.restaurant-page {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 30px 15px;
  text-align: center;
}

.restaurant-options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  margin-top: 30px;
}

.restaurant-card {
  min-width: 0;
  background: #fff5f9;
  border: 3px solid transparent;
  border-radius: 18px;
  padding: 10px;
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(130,40,80,0.12);
  transition: transform 0.25s, border-color 0.25s;
}

.restaurant-card:hover {
  transform: translateY(-5px);
}

.restaurant-card.selected {
  border-color: #e34d90;
  background: #ffe0ee;
}

.restaurant-card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
}

.restaurant-card h3 {
  color: #a32357;
  font-size: 17px;
  margin: 12px 0;
  min-height: 42px;
}

.yelp-link {
  display: inline-block;
  color: #d43b73;
  font-size: 14px;
  font-weight: bold;
  text-decoration: underline;
  margin-bottom: 10px;
}

.restaurant-navigation {
  margin-top: 25px;
}

.restaurant-navigation button {
  background: #e879a2;
  border-radius: 25px;
}

.restaurant-message {
  color: #a32357;
  font-weight: bold;
  min-height: 24px;
  margin-top: 20px;
}

@media (max-width: 650px) {
  .restaurant-options {
    grid-template-columns: 1fr;
    max-width: 350px;
    margin: 25px auto;
  }

  body:has(.restaurant-page) {
    overflow-y: auto;
  }
}

/* PAGE 4 - DESSERT CHOICE */

.dessert-page {
  width: 100%;
  max-width: 750px;
  margin: auto;
  padding: 30px 15px;
  text-align: center;
}

.dessert-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 25px;
  margin-top: 30px;
}

.dessert-card {
  width: 100%;
  height: 310px;
  background: #fff5f9;
  border: 3px solid transparent;
  border-radius: 20px;
  padding: 15px;
  cursor: pointer;
  box-shadow: 0 5px 18px rgba(130,40,80,0.12);
  transition: transform 0.25s, border-color 0.25s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.dessert-card:hover {
  transform: translateY(-8px);
  border-color: #e34d90;
}

.dessert-card img {
  width: 100%;
  height: 230px;
  object-fit: contain;
  border-radius: 12px;
}

.dessert-card h3 {
  color: #a32357;
  font-size: 21px;
  margin: 15px 0 0;
}

@media (max-width: 650px) {
  .dessert-options {
    gap: 12px;
  }

  .dessert-card {
    height: 230px;
    padding: 8px;
  }

  .dessert-card img {
    height: 165px;
  }

  .dessert-card h3 {
    font-size: 17px;
  }

  body:has(.dessert-page) {
    overflow-y: auto;
  }
}

  </style>
</head>

<body>

  <div class="container">
  <h2 class="greeting">Hey Veee! 💗</h2>

  <h1>Will you go on a date with me? 💕</h1>


    <img
      src="panda.jpg"
      class="panda"
      alt="Cute panda holding a donut"
    >

    <div class="buttons">
      <button id="yesBtn">Yes 💚</button>
      <button id="noBtn">No ❤️</button>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    let lastMove = 0;

    // Teleport No button to a random position

function moveNoButton() {
  const margin = 15;
  const width = noBtn.offsetWidth;
  const height = noBtn.offsetHeight;

  const maxX = Math.max(
    margin,
    window.innerWidth - width - margin
  );

  const maxY = Math.max(
    margin,
    window.innerHeight - height - margin
  );

  const x = margin + Math.random() * (maxX - margin);
  const y = margin + Math.random() * (maxY - margin);

  // Capture the button's current position
  if (noBtn.style.position !== "fixed") {
    const rect = noBtn.getBoundingClientRect();

    noBtn.style.transition = "none";
    noBtn.style.position = "fixed";
    noBtn.style.left = rect.left + "px";
    noBtn.style.top = rect.top + "px";

    // Register the starting position
    void noBtn.offsetWidth;

    noBtn.style.transition =
      "left 0.6s ease, top 0.6s ease";
  }

  // Float to the new position
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}


    // Dodge when mouse approaches
    document.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") return;

      const rect = noBtn.getBoundingClientRect();

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const distance = Math.hypot(
        event.clientX - centerX,
        event.clientY - centerY
      );

      if (distance < 110 && Date.now() - lastMove > 150) {
        lastMove = Date.now();
        moveNoButton();
      }
    });

    // Dodge taps on mobile
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    // Fallback if No is clicked
    noBtn.addEventListener("click", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    // Yes button celebration
    yesBtn.addEventListener("click", () => {
      document.querySelector(".container").innerHTML = `
        <h1>YAYYYYY!! 💗</h1>

        <img
  src="celebrating-panda.jpg"
  class="panda"
  alt="Happy panda"
>

        <h2 style="color:#a32357">
          I knew you'd say yes!
        </h2>

        <p style="color:#a32357">
          Now let's plan our date ♡
        </p>

        <button
          style="background:#e879a2;margin-top:20px"
          onclick="startPlanning()">
          Plan Our Date →
        </button>
      `;
    });

    
let selectedMuseum = localStorage.getItem("museumChoice") || "";

function startPlanning() {
  document.querySelector(".container").innerHTML = `
    <div class="museum-page">

      <h1>Larping as a Museum Couple 💗</h1>

      <p class="museum-subtitle">
        Where should we go together? 🥰
      </p>

      <div class="museum-options">

        <button class="museum-card"
                data-museum="The Getty"
                onclick="chooseMuseum('The Getty')">
          <img src="getty.jpg" alt="The Getty">
          <h3>The Getty</h3>
        </button>

        <button class="museum-card"
                data-museum="Griffith Observatory"
                onclick="chooseMuseum('Griffith Observatory')">
          <img src="griffith.jpg" alt="Griffith Observatory">
          <h3>Griffith Observatory</h3>
        </button>

        <button class="museum-card"
                data-museum="LACMA"
                onclick="chooseMuseum('LACMA')">
          <img src="lacma.jpg" alt="LACMA">
          <h3>LACMA</h3>
        </button>

      </div>

      <p class="museum-message" id="museumMessage"></p>

      <div class="museum-navigation">
        <button onclick="saveMuseum()">
          Save My Choice ♡
        </button>
      </div>

    </div>
  `;

  if (selectedMuseum) {
    chooseMuseum(selectedMuseum);
  }
}

function chooseMuseum(museum) {
  selectedMuseum = museum;

  document.querySelectorAll(".museum-card").forEach(card => {
    card.classList.toggle(
      "selected",
      card.dataset.museum === museum
    );
  });

  document.getElementById("museumMessage").textContent =
    museum + " 💗";
}


function saveMuseum() {
  if (!selectedMuseum) {
    document.getElementById("museumMessage").textContent =
      "Pick a museum first! 💕";
    return;
  }

  localStorage.setItem("museumChoice", selectedMuseum);

  // Go to Page 3
  startRestaurantPage();
}

let selectedRestaurant =
  localStorage.getItem("restaurantChoice") || "";

function startRestaurantPage() {
  document.querySelector(".container").innerHTML = `
    <div class="restaurant-page">

      <h1>Where should we eat after? 🍽️💕</h1>

      <p class="museum-subtitle">
        Pick our dinner spot! ♡
      </p>

      <div class="restaurant-options">

        <div class="restaurant-card"
             data-restaurant="BCD"
             onclick="chooseRestaurant('BCD')">
          <img src="bcd.jpg" alt="BCD food">
          <h3>BCD</h3>
          <a class="yelp-link"
             href="https://www.yelp.com/biz/bcd-tofu-house-los-angeles?osq=bcd"
             target="_blank"
             rel="noopener noreferrer"
             onclick="event.stopPropagation()">
            View on Yelp ↗
          </a>
        </div>

        <div class="restaurant-card"
             data-restaurant="Here Fishy Fishy"
             onclick="chooseRestaurant('Here Fishy Fishy')">
          <img src="fish.jpg" alt="Sushi platter">
          <h3>Here Fishy Fishy</h3>
          <a class="yelp-link"
             href="https://www.yelp.com/biz/here-fishy-fishy-wilshire-blvd-los-angeles-7?osq=here+fishy+fishy"
             target="_blank"
             rel="noopener noreferrer"
             onclick="event.stopPropagation()">
            View on Yelp ↗
          </a>
        </div>

        <div class="restaurant-card"
             data-restaurant="Danbi"
             onclick="chooseRestaurant('Danbi')">
          <img src="danbi.jpg" alt="Danbi food">
          <h3>Danbi</h3>
          <a class="yelp-link"
             href="https://www.yelp.com/biz/danbi-los-angeles-2?osq=Danbi+Korean+Restaurant"
             target="_blank"
             rel="noopener noreferrer"
             onclick="event.stopPropagation()">
            View on Yelp ↗
          </a>
        </div>

      </div>

      <p class="restaurant-message" id="restaurantMessage"></p>

      <div class="restaurant-navigation">
        <button onclick="saveRestaurant()">
          Save My Choice ♡
        </button>
      </div>

    </div>
  `;

  if (selectedRestaurant) {
    chooseRestaurant(selectedRestaurant);
  }
}

function chooseRestaurant(restaurant) {
  selectedRestaurant = restaurant;

  document.querySelectorAll(".restaurant-card").forEach(card => {
    card.classList.toggle(
      "selected",
      card.dataset.restaurant === restaurant
    );
  });

  document.getElementById("restaurantMessage").textContent =
    restaurant + " 💗";
}


function saveRestaurant() {
  if (!selectedRestaurant) {
    document.getElementById("restaurantMessage").textContent =
      "Pick a restaurant first! 💕";
    return;
  }

  localStorage.setItem("restaurantChoice", selectedRestaurant);

  // Go to Page 4
  startDessertPage();
}

function startDessertPage() {
  document.querySelector(".container").innerHTML = `
    <div class="dessert-page">

      <h1>Dessert? 💗</h1>

      <p class="museum-subtitle">
        What are we craving? ♡
      </p>

      <div class="dessert-options">

        <button class="dessert-card"
                onclick="chooseDessertType('Drinks')">
          <img src="drink.jpg" alt="Cute matcha drink">
          <h3>Drinks 🧋</h3>
        </button>

        <button class="dessert-card"
                onclick="chooseDessertType('Ice Cream')">
          <img src="icecream.jpg" alt="Strawberry ice cream">
          <h3>Ice Cream 🍦</h3>
        </button>

      </div>

    </div>
  `;
}

function chooseDessertType(type) {
  localStorage.setItem("dessertType", type);

  if (type === "Drinks") {
    startDrinksPage();
  } else {
    startIceCreamPage();
  }
}

// Temporary pages until we add the actual choices

function startDrinksPage() {
  document.querySelector(".container").innerHTML = `
    <h1>Drinks 🧋💕</h1>
    <p style="color:#a32357">
      Let's pick our drinks!
    </p>
  `;
}

function startIceCreamPage() {
  document.querySelector(".container").innerHTML = `
    <h1>Ice Cream 🍦💕</h1>
    <p style="color:#a32357">
      Let's pick our ice cream!
    </p>
  `;
}


  </script>

</body>
</html>
