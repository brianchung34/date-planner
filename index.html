
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Date ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        120deg,
        #f9d6e8,
        #f4a6c8,
        #e889b4,
        #f8c4df
      );
      background-size: 300% 300%;
      animation: gradientMove 10s ease infinite;
    }

    .container {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #a32357;
      font-size: clamp(25px, 5vw, 42px);
      margin-bottom: 25px;
    }

    h2, p {
      color: #a32357;
    }

    .panda {
      width: 230px;
      max-width: 70vw;
      height: auto;
      border-radius: 20px;
      margin: 15px 0;
      animation: float 2s ease-in-out infinite;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-top: 30px;
      min-height: 55px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    #yesBtn {
      background: #4caf50;
      box-shadow: 0 4px 12px #a0cfa2;
      transition: transform 0.2s;
    }

    #yesBtn:hover {
      transform: scale(1.15);
    }

    
#noBtn {
  background: #e74c3c;
  position: relative;
  z-index: 10;
  cursor: pointer;
  touch-action: none;
  transition: transform 0.5s ease-out;
  will-change: transform;
}


    .nextBtn {
      background: #e879a2;
      margin-top: 20px;
      transition: transform 0.2s;
    }

    .nextBtn:hover {
      transform: scale(1.08);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes gradientMove {
      0%, 100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }
  </style>
</head>

<body>

  <main class="container" id="main">

    <h1>Will you go on a date with me? 💕</h1>

    <img
      src="panda.jpg"
      class="panda"
      alt="Cute panda holding a donut"
    >

    <div class="buttons">
      <button id="yesBtn">Yes 💚</button>
      <button id="noBtn">No ❤️</button>
    </div>

  </main>

 
<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  let offsetX = 0;
  let offsetY = 0;
  let lastDodge = 0;

  function dodge(mouseX, mouseY) {
    const rect = noBtn.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    // Find direction away from mouse
    let dx = centerX - mouseX;
    let dy = centerY - mouseY;

    let distance = Math.hypot(dx, dy);

    if (distance < 1) {
      dx = Math.random() - 0.5;
      dy = Math.random() - 0.5;
      distance = Math.hypot(dx, dy) || 1;
    }

    dx /= distance;
    dy /= distance;

    // Move 160 pixels away
    const moveDistance = 160;

    let newX = offsetX + dx * moveDistance;
    let newY = offsetY + dy * moveDistance;

    // Keep the button inside the viewport
    const baseLeft = rect.left - offsetX;
    const baseTop = rect.top - offsetY;

    newX = Math.max(
      10 - baseLeft,
      Math.min(
        window.innerWidth - rect.width - 10 - baseLeft,
        newX
      )
    );

    newY = Math.max(
      10 - baseTop,
      Math.min(
        window.innerHeight - rect.height - 10 - baseTop,
        newY
      )
    );

    offsetX = newX;
    offsetY = newY;

    // Smooth movement handled by CSS transition
    noBtn.style.transform =
      `translate(${offsetX}px, ${offsetY}px)`;
  }

  // Move away when the mouse gets close
  document.addEventListener("pointermove", (event) => {
    if (event.pointerType === "touch") return;

    const rect = noBtn.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const distance = Math.hypot(
      event.clientX - centerX,
      event.clientY - centerY
    );

    if (distance < 140 && Date.now() - lastDodge > 500) {
      lastDodge = Date.now();
      dodge(event.clientX, event.clientY);
    }
  });

  // Move away from mobile taps
  noBtn.addEventListener("touchstart", (event) => {
    event.preventDefault();

    const touch = event.touches[0];
    dodge(touch.clientX, touch.clientY);
  }, { passive: false });

  // Fallback if someone clicks No
  noBtn.addEventListener("click", (event) => {
    event.preventDefault();

    const rect = noBtn.getBoundingClientRect();

    dodge(
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );
  });

  // Yes button celebration
  yesBtn.addEventListener("click", () => {
    document.querySelector(".container").innerHTML = `
      <h1>YAYYYYY!! 💗</h1>

      <img src="panda.jpg"
           class="panda"
           alt="Happy panda">

      <h2>I knew you'd say yes! 🥰</h2>

      <p>Now let's plan our perfect date ♡</p>

      <button
        style="background:#e879a2;margin-top:20px"
        onclick="startPlanning()">
        Plan Our Date →
      </button>
    `;
  });

  function startPlanning() {
    alert("Time to choose our dinner! 🍝");
  }
</script>

</body>
</html>
