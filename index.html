
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Date ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(
        120deg,
        #f9d6e8,
        #f4a6c8,
        #e889b4,
        #f8c4df
      );
      background-size: 300% 300%;
      animation: gradientMove 10s ease infinite;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #a32357;
      font-size: clamp(25px, 5vw, 42px);
      margin-bottom: 25px;
    }

    .panda {
      width: 230px;
      max-width: 75vw;
      height: auto;
      border-radius: 20px;
      margin: 15px 0;
      animation: float 2s ease-in-out infinite;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
      min-height: 55px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yesBtn {
      background: #4caf50;
      box-shadow: 0 4px 12px #a0cfa2;
    }

    #yesBtn:hover {
      transform: scale(1.15);
    }

#noBtn {
  background: #e74c3c;
  position: relative;
  z-index: 10;
  touch-action: none;

  transition: left 0.6s ease, top 0.6s ease;
}

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes gradientMove {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Will you go on a date with me? 💕</h1>

    <img
      src="panda.jpg"
      class="panda"
      alt="Cute panda holding a donut"
    >

    <div class="buttons">
      <button id="yesBtn">Yes 💚</button>
      <button id="noBtn">No ❤️</button>
    </div>

  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    let lastMove = 0;

    // Teleport No button to a random position

function moveNoButton() {
  const margin = 15;
  const width = noBtn.offsetWidth;
  const height = noBtn.offsetHeight;

  const maxX = Math.max(
    margin,
    window.innerWidth - width - margin
  );

  const maxY = Math.max(
    margin,
    window.innerHeight - height - margin
  );

  const x = margin + Math.random() * (maxX - margin);
  const y = margin + Math.random() * (maxY - margin);

  // Capture the button's current position
  if (noBtn.style.position !== "fixed") {
    const rect = noBtn.getBoundingClientRect();

    noBtn.style.transition = "none";
    noBtn.style.position = "fixed";
    noBtn.style.left = rect.left + "px";
    noBtn.style.top = rect.top + "px";

    // Register the starting position
    void noBtn.offsetWidth;

    noBtn.style.transition =
      "left 0.6s ease, top 0.6s ease";
  }

  // Float to the new position
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}


    // Dodge when mouse approaches
    document.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") return;

      const rect = noBtn.getBoundingClientRect();

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const distance = Math.hypot(
        event.clientX - centerX,
        event.clientY - centerY
      );

      if (distance < 110 && Date.now() - lastMove > 150) {
        lastMove = Date.now();
        moveNoButton();
      }
    });

    // Dodge taps on mobile
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    // Fallback if No is clicked
    noBtn.addEventListener("click", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    // Yes button celebration
    yesBtn.addEventListener("click", () => {
      document.querySelector(".container").innerHTML = `
        <h1>YAYYYYY!! 💗</h1>

        <img
  src="celebrating-panda.jpg"
  class="panda"
  alt="Happy panda"
>

        <h2 style="color:#a32357">
          I knew you'd say yes!
        </h2>

        <p style="color:#a32357">
          Now let's plan our date ♡
        </p>

        <button
          style="background:#e879a2;margin-top:20px"
          onclick="startPlanning()">
          Plan Our Date →
        </button>
      `;
    });

    function startPlanning() {
      alert("Time to choose our dinner! 🍝");
    }
  </script>

</body>
</html>
