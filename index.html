<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Little Date ♡</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(125deg,#fbd9e7,#f5b2d0,#f9cbdc); background-size: 250% 250%; animation: gradient 12s ease infinite; color: #a72d60; }
    main { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 22px; text-align: center; }
    h1 { font-size: clamp(24px, 5vw, 38px); margin: 0 0 22px; }
    .panda { width: min(255px, 70vw); aspect-ratio: 1; object-fit: cover; border-radius: 22px; animation: bob 2.5s ease-in-out infinite; box-shadow: 0 12px 35px #a93c6620; }
    .buttons { display: flex; gap: 18px; justify-content: center; align-items: center; margin-top: 24px; min-height: 54px; }
    button { cursor: pointer; border: 0; border-radius: 12px; padding: 13px 28px; color: white; font-weight: 700; font-size: 17px; box-shadow: 0 5px 12px #953f6225; }
    #yesBtn, #planBtn { background: #45a653; }
    #yesBtn:hover, #planBtn:hover { background: #348e41; }
    
#noBtn {
  background: #e74c3c;
  position: relative;
  z-index: 10;
  touch-action: none;
  transition: left 0.45s ease-out,
              top 0.45s ease-out;
  will-change: left, top;
}

    #planBtn { margin-top: 24px; background: #dc6997; }
    .hidden { display: none !important; }
    p { font-size: 19px; line-height: 1.6; }
    @keyframes bob { 50% { transform: translateY(-10px); } }
    @keyframes gradient { 50% { background-position: 100% 50%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Will you go on a date with me? 💕</h1>
    <img class="panda" src="panda.jpg" alt="Cute panda holding a pink donut">
    <div class="buttons" id="choices">
      <button id="yesBtn" type="button">Yes 💚</button>
      <button id="noBtn" type="button">No ❤️</button>
    </div>
    <div id="celebration" class="hidden" aria-live="polite">
      <p>YAYYYYY!! 💗<br>Now let's plan our date ♡</p>
      <button id="planBtn" type="button">Plan Our Date →</button>
    </div>
  </main>
  <script>
    const noBtn = document.getElementById('noBtn');
    let lastMove = 0;
    
function moveNoButton() {
  const margin = 15;
  const width = noBtn.offsetWidth;
  const height = noBtn.offsetHeight;

  const maxX = Math.max(
    margin,
    window.innerWidth - width - margin
  );

  const maxY = Math.max(
    margin,
    window.innerHeight - height - margin
  );

  const x = margin + Math.random() * (maxX - margin);
  const y = margin + Math.random() * (maxY - margin);

  // Keep its current screen position before moving
  const rect = noBtn.getBoundingClientRect();

  if (noBtn.style.position !== "fixed") {
    noBtn.style.transition = "none";
    noBtn.style.position = "fixed";
    noBtn.style.left = rect.left + "px";
    noBtn.style.top = rect.top + "px";

    // Force the browser to register the starting position
    void noBtn.offsetWidth;

    noBtn.style.transition =
      "left 0.45s ease-out, top 0.45s ease-out";
  }

  // Smoothly glide to its new position
  requestAnimationFrame(() => {
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });
}

    document.addEventListener('pointermove', (event) => {
      if (event.pointerType === 'touch' || document.getElementById('choices').classList.contains('hidden')) return;
      const r = noBtn.getBoundingClientRect();
      if (Math.hypot(event.clientX - (r.left + r.width/2), event.clientY - (r.top + r.height/2)) < 105 && Date.now() - lastMove > 140) {
        lastMove = Date.now(); dodge();
      }
    });
    noBtn.addEventListener('pointerdown', event => { event.preventDefault(); dodge(); });
    noBtn.addEventListener('click', event => { event.preventDefault(); dodge(); });
    noBtn.addEventListener('focus', dodge);
    document.getElementById('yesBtn').addEventListener('click', () => {
      document.getElementById('heading').textContent = 'She said YES!! 💖';
      document.getElementById('choices').classList.add('hidden');
      document.getElementById('celebration').classList.remove('hidden');
    });
    document.getElementById('planBtn').addEventListener('click', () => {
      alert('Page 2 is coming next! 🍝');
    });
  </script>
</body>
</html>
