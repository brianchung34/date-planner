/* ENVELOPE AND SECRET LETTER */

.letter-scene {
  position: relative;
  width: 300px;
  height: 210px;
  margin: 35px auto 0;
  cursor: pointer;
  perspective: 900px;
}

/* Envelope body */
.envelope-back {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 300px;
  height: 180px;
  background: #f6a4c5;
  border-radius: 12px;
  z-index: 1;
}

.envelope-front {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 300px;
  height: 180px;
  background: #e987b0;
  clip-path: polygon(
    0 0, 50% 55%, 100% 0,
    100% 100%, 0 100%
  );
  border-radius: 12px;
  z-index: 3;
}

/* Envelope flap */
.envelope-flap {
  position: absolute;
  left: 0;
  bottom: 90px;
  width: 300px;
  height: 90px;
  background: #ffd0e2;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform 0.7s ease;
  z-index: 4;
}

.envelope-heart {
  position: absolute;
  left: 50%;
  bottom: 50px;
  transform: translateX(-50%);
  font-size: 35px;
  z-index: 5;
  transition: opacity 0.3s;
}

/* Secret letter is completely hidden initially */
.letter-paper {
  position: absolute;
  left: 50%;
  top: 0;
  width: min(440px, 90vw);
  max-height: 60vh;
  overflow-y: auto;
  padding: 25px;
  box-sizing: border-box;
  background: #fffafc;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(130,40,80,0.18);
  z-index: 6;

  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 30px) scale(0.8);
  transition:
    opacity 0.5s ease,
    transform 0.7s ease,
    visibility 0s linear 0.7s;
}

.letter-paper p {
  color: #a32357;
  font-size: 16px;
  line-height: 1.7;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

/* Open envelope */
.letter-scene.open .envelope-flap {
  transform: rotateX(180deg);
}

.letter-scene.open .envelope-heart {
  opacity: 0;
}

/* Letter rises above the envelope */
.letter-scene.open .letter-paper {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -65%);
  transition:
    opacity 0.5s ease 0.5s,
    transform 0.7s ease 0.5s,
    visibility 0s;
}

/* Give the opened letter enough space */
.letter-scene.open {
  margin-top: 230px;
  margin-bottom: 35px;
  transition: margin-top 0.7s ease;
}

body:has(.final-page) {

@media (max-width: 650px) {
  .letter-scene {
    transform: none;
    margin-bottom: 0;
  }

  .letter-scene.open {
    margin-top: 230px;
  }
}

function moveNoButton() {
  const margin = 15;
  const width = noBtn.offsetWidth;
  const height = noBtn.offsetHeight;

  const maxX = Math.max(
    margin,
    window.innerWidth - width - margin
  );

  const maxY = Math.max(
    margin,
    window.innerHeight - height - margin
  );

  const x = margin + Math.random() * (maxX - margin);
  const y = margin + Math.random() * (maxY - margin);

  // Capture the button's current position
  if (noBtn.style.position !== "fixed") {
    const rect = noBtn.getBoundingClientRect();

    noBtn.style.transition = "none";
    noBtn.style.position = "fixed";
    noBtn.style.left = rect.left + "px";
    noBtn.style.top = rect.top + "px";

    // Register the starting position
    void noBtn.offsetWidth;

    noBtn.style.transition =
      "left 0.6s ease, top 0.6s ease";
  }

  // Float to the new position
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

async function saveDateOnline() {
  const museum = localStorage.getItem("museumChoice");
  const restaurant = localStorage.getItem("restaurantChoice");
  const dessertType = localStorage.getItem("dessertType");

  let dessertChoice;

  if (dessertType === "Drinks") {
    dessertChoice = localStorage.getItem("drinkChoice");

    if (dessertChoice === "Your Choice") {
      dessertChoice =
        localStorage.getItem("customDrink");
    }
  } else {
    dessertChoice =
      localStorage.getItem("iceCreamChoice");

    if (dessertChoice === "Your Choice") {
      dessertChoice =
        localStorage.getItem("customIceCream");
    }
  }

  if (!museum || !restaurant ||
      !dessertType || !dessertChoice) {
    alert("Please complete all your selections!");
    return false;
  }

  try {
    const { error } = await db
      .from("date_selections")
      .insert({
        museum: museum,
        restaurant: restaurant,
        dessert_type: dessertType,
        dessert_choice: dessertChoice
      });

    if (error) throw error;

    return true;
  } catch (error) {
    console.error("Error saving date:", error);
    alert("Something went wrong saving your date. Please try again!");
    return false;
  }
}
